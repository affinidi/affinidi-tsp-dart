name: affinidi_tsp_workspace
description: Dart packages for the Trust Spanning Protocol (TSP).
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - packages/affinidi_tsp
  - packages/affinidi_tsp_pq

dev_dependencies:
  coverage: ^1.11.1
  dart_flutter_team_lints: ^3.2.1
  melos: ^8.7.0
  test: ^1.24.0

melos:
  scripts:
    analyze:
      description: Run dart analyze on all workspace packages
      exec: dart analyze .
      concurrency: 4
      failFast: true
      noSelect: true

    test:
      run: |
        melos run test-dart &&
        melos run coverage-report

    test-dart:
      description: Run tests with coverage in each workspace package
      exec: dart run coverage:test_with_coverage -- --reporter expanded
      dirExists: test
      concurrency: 4
      failFast: true
      noSelect: true

    coverage-report:
      description: Merge per-package lcov output into coverage/lcov.info
      run: >
        mkdir -p coverage &&

        find packages -name lcov.info -path '*/coverage/*' -print0
        | xargs -0 cat > coverage/lcov.info &&

        echo "Coverage report generated at coverage/lcov.info"
