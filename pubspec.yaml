name: affinidi_tsp
description: >-
  Trust Spanning Protocol (TSP) Rev 3 for Dart: CESR framing, HPKE-Base,
  libsodium sealed box, signed-only messages, relationship control and an
  ssi-integrated layer for DID-based VIDs.
version: 0.1.0
repository: https://github.com/affinidi/affinidi-tsp-dart
issue_tracker: https://github.com/affinidi/affinidi-tsp-dart/issues
topics:
  - tsp
  - cryptography
  - did
  - ssi
  - messaging

environment:
  sdk: ^3.8.0

platforms:
  web:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  crypto: ^3.0.6
  cryptography: ^2.7.0
  meta: ^1.16.0
  pinenacl: ^0.6.0
  ssi: '>=3.9.0 <5.0.0'

dev_dependencies:
  dart_flutter_team_lints: ^3.2.1
  test: ^1.24.0
