name: publish

on:
  push:
    tags:
      - "**v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

jobs:
  dart-pipeline:
    uses: affinidi/pipeline-dart/.github/workflows/publish.yaml@d128983279267e829f298ae170be08ff87f46bfd # pipeline-dart#33 head 2026-11-25, re-pin to its merge commit
    secrets: inherit
    with:
      publish: true
      flutter-version: '3.41.9'
